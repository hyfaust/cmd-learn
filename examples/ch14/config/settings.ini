; ============================================================
; 配置文件示例 - settings.ini
; 用于演示配置文件读取功能
; ============================================================

[general]
; 应用基本配置
app_name=CMD学习项目
app_version=1.0.0
app_author=学习者
app_description=CMD/BAT脚本学习实战项目

[paths]
; 路径配置
source_dir=%~dp0source
backup_dir=%~dp0backup
output_dir=%~dp0output
log_dir=%~dp0logs

[logging]
; 日志配置
log_level=INFO
log_file=app.log
max_log_size=10485760
log_backup_count=5

[backup]
; 备份配置
backup_enabled=true
backup_interval=24
backup_retention_days=30
backup_compression=true
backup_encryption=false

[deploy]
; 部署配置
deploy_environment=development
deploy_timeout=300
health_check_enabled=true
health_check_interval=30
rollback_enabled=true

[network]
; 网络配置
server_host=localhost
server_port=8080
connection_timeout=30
retry_count=3
retry_delay=5

[security]
; 安全配置
encryption_enabled=false
ssl_enabled=false
certificate_path=
private_key_path=

[notifications]
; 通知配置
email_enabled=false
email_smtp_server=
email_smtp_port=587
email_username=
email_password=
email_recipients=

[performance]
; 性能配置
max_threads=4
buffer_size=8192
cache_enabled=true
cache_size=104857600
cache_ttl=3600